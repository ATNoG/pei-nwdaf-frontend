services:
  #---- Reverse Proxy
  nginx:
    build: ./revproxy/
    container_name: nginx
    ports:
      - "${NGINX_PORT1}:${NGINX_PORT1}"
      - "${NGINX_PORT2}:${NGINX_PORT2}"
    environment:
      - KEYCLOAK_HOST=${KEYCLOAK_HOST}
      - KEYCLOAK_PORT=${KEYCLOAK_PORT}
      - POLICY_HOST=${POLICY_HOST}
      - POLICY_PORT=${POLICY_PORT}
      - DASHBOARD_HOST=${DASHBOARD_HOST}
      - DASHBOARD_PORT=${DASHBOARD_PORT}
      - ML_HOST=${ML_HOST}
      - ML_PORT=${ML_PORT}
      - DECISION_HOST=${DECISION_HOST}
      - DECISION_PORT=${DECISION_PORT}
      - DATA_INGESTION_HOST=${DATA_INGESTION_HOST}
      - DATA_INGESTION_PORT=${DATA_INGESTION_PORT}
      - DATA_STORAGE_HOST=${DATA_STORAGE_HOST}
      - DATA_STORAGE_PORT=${DATA_STORAGE_PORT}
      - MLFLOW_HOST=${MLFLOW_HOST}
      - MLFLOW_PORT=${MLFLOW_PORT}
    healthcheck:
      test: ["CMD-SHELL", "service nginx status"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 15s
    networks:
      - nwdaf-network
    restart: unless-stopped

  #---- Frontend
  frontend:
    build:
      context: .
      args:
        - VITE_ML_HOST=${VITE_ML_HOST:-pei-ml}
        - VITE_DATA_STORAGE_HOST=${VITE_DATA_STORAGE_HOST:-data-storage}
        - VITE_MLFLOW_URL=${VITE_MLFLOW_URL:-/mlflow}
        - VITE_RAW_DATA_URL=${VITE_RAW_DATA_URL}
        - VITE_DATA_STORAGE_URL=${VITE_DATA_STORAGE_URL}
        - VITE_ML_URL=${VITE_ML_URL}
        - VITE_POLICY_SERVICE_URL=${VITE_POLICY_SERVICE_URL}
        - VITE_AVAILABLE_COMPONENTS=${VITE_AVAILABLE_COMPONENTS}
    container_name: frontend
    ports:
      - "5173:5173"
    develop:
      watch:
        - path: .
          action: rebuild
    environment:
      - VITE_ML_HOST=${VITE_ML_HOST:-pei-ml}
      - VITE_DATA_STORAGE_HOST=${VITE_DATA_STORAGE_HOST:-data-storage}
      - VITE_MLFLOW_URL=${VITE_MLFLOW_URL:-http://localhost:5000}
      - VITE_AVAILABLE_COMPONENTS=${VITE_AVAILABLE_COMPONENTS}
      - VITE_RAW_DATA_URL=${VITE_RAW_DATA_URL:-http://localhost:7000}
      - VITE_DATA_STORAGE_URL=${VITE_DATA_STORAGE_URL:-http://localhost:8000}
      - VITE_ML_URL=${VITE_ML_URL:-http://localhost:8060}
      - VITE_POLICY_SERVICE_URL=${VITE_POLICY_SERVICE_URL}
      - POLICY_HOST=${POLICY_HOST:-policy-service}
      - POLICY_PORT=${POLICY_PORT:-8788}
    working_dir: /app
    networks:
      - nwdaf-network
    restart: unless-stopped

networks:
  nwdaf-network:
    name: nwdaf-network
