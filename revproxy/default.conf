# }

# Dashboard Service
upstream dashboard_backend {
    server $DASHBOARD_HOST:$DASHBOARD_PORT;
}

# ML API
upstream ml_api {
    server $ML_HOST:$ML_PORT;
}

# Decision API
upstream decision_api {
    server $DECISION_HOST:$DECISION_PORT;
}

# Policy API
upstream policy_api {
    server $POLICY_HOST:$POLICY_PORT;
}

# Data Ingestion API (raw-data)
upstream data_ingestion_api {
    server $DATA_INGESTION_HOST:$DATA_INGESTION_PORT;
}

# Data Storage API
upstream data_storage_api {
    server $DATA_STORAGE_HOST:$DATA_STORAGE_PORT;
}

# MLflow UI
upstream mlflow_ui {
    server $MLFLOW_HOST:$MLFLOW_PORT;
}

server {
    listen 80;
    server_name _;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws: wss:;" always;

    # Policy API
    location /policy-api/ {
        proxy_pass http://policy_api/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ML API + WebSocket (mirrors vite proxy: /pei-ml → ml service)
    location /pei-ml/ {
        proxy_pass http://ml_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 3600s;
    }

    # Data Storage API
    location /data-storage/ {
        proxy_pass http://data_storage_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Data Ingestion API + WebSocket (mirrors vite proxy: /data-ingestion → ingestion service)
    location /data-ingestion/ {
        proxy_pass http://data_ingestion_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 3600s;
    }

    # MLflow UI - entry point (strips /mlflow/ prefix)
    location = /mlflow {
        return 301 /mlflow/;
    }
    location /mlflow/ {
        proxy_pass http://mlflow_ui/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    #location /static-files/ {
    #    proxy_pass http://mlflow_ui/static-files/;
    #    proxy_set_header Host $host;
    #    proxy_connect_timeout 30s;
    #    proxy_read_timeout 60s;
    #}
    #location /ajax-api/ {
    #    proxy_pass http://mlflow_ui/ajax-api/;
    #    proxy_set_header Host $host;
    #    proxy_connect_timeout 30s;
    #    proxy_read_timeout 60s;
    #}

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }

    location / {
        proxy_pass http://dashboard_backend/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_buffering off;

        # SPA fallback: se o backend devolver 404, devolve /
        proxy_intercept_errors on;
        error_page 404 = /;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
